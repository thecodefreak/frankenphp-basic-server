services:
  php:
    container_name: instaposter
    build: .
    restart: always
    env_file: .env
    ports:
      - "8087:80"
    volumes:
      - ./.env:/app/.env:ro
      - insta_data:/data
      - insta_images:/app/public/storage/images
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  insta_data:
  insta_images:
